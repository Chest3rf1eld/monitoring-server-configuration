---
- name: Install Prometheus dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - tar
    state: present

- name: Create Prometheus group
  ansible.builtin.group:
    name: prometheus
    system: true

- name: Create Prometheus user
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download Prometheus archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"

- name: Extract Prometheus archive
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /tmp
    remote_src: true

- name: Install Prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool

- name: Install Prometheus console templates
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/etc/prometheus/{{ item }}"
    owner: prometheus
    group: prometheus
    mode: "0755"
    remote_src: true
  loop:
    - consoles
    - console_libraries

- name: Deploy Prometheus config
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.first_found', params) }}"
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  vars:
    params:
      files:
        - "{{ inventory_hostname }}.yml"
        - default.yml
      paths:
        - "{{ inventory_dir }}/files/prometheus"
  notify: restart prometheus

- name: Deploy Prometheus web config
  ansible.builtin.template:
    src: web.yml.j2
    dest: /etc/prometheus/web.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
  notify: restart prometheus

- name: Install Prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify:
    - reload systemd
    - restart prometheus

- name: Reload systemd after unit change
  ansible.builtin.meta: flush_handlers

- name: Validate Prometheus configuration
  ansible.builtin.command:
    cmd: /usr/local/bin/promtool check config /etc/prometheus/prometheus.yml
  changed_when: false

- name: Enable and start Prometheus
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true

- name: Wait for Prometheus readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:9090/-/ready"
    return_content: false
    status_code: 200
  register: prometheus_ready
  retries: 10
  delay: 3
  until: prometheus_ready.status == 200

- name: Install and configure node_exporter
  ansible.builtin.include_tasks: node_exporter.yml

- name: Build allowed IP list for Prometheus GUI
  ansible.builtin.set_fact:
    prometheus_firewall_allowed_ips: >-
      {{ (prometheus_firewall_whitelist_ips | default([]))
         if (prometheus_firewall_whitelist_ips | default([]) | length > 0)
         else ((groups['observation_servers'] | default([]))
         | map('extract', hostvars)
         | map(attribute='ansible_host')
         | list) }}

- name: Configure firewall with nftables
  ansible.builtin.include_tasks: firewall.yml
