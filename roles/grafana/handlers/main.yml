---
- name: reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: apply nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: restart grafana
  ansible.builtin.command: systemctl reset-failed grafana-server.service
  changed_when: false
  failed_when: false

- name: start grafana
  ansible.builtin.service:
    name: grafana-server
    state: started
