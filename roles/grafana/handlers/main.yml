---
- name: reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: apply nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true

- name: restart grafana
  block:
    - name: reset failed state for grafana
      ansible.builtin.command: systemctl reset-failed grafana-server.service
      changed_when: false
      failed_when: false

    - name: restart grafana service
      ansible.builtin.service:
        name: grafana-server
        state: restarted
