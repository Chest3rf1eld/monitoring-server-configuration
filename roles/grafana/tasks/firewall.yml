---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Deploy nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
  notify: apply nftables

- name: Enable and start nftables
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true
