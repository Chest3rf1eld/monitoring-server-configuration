---
- name: update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Install Grafana APT prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - wget
    state: present

- name: Ensure Grafana keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Grafana GPG key
  block:
    - name: Check Grafana GPG key URL availability
      ansible.builtin.uri:
        url: https://apt.grafana.com/gpg.key
        method: HEAD
        return_content: false
        timeout: 10
        validate_certs: true
      register: grafana_key_head
      failed_when: false
      changed_when: false

    - name: Download Grafana GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.gpg.asc
        mode: "0644"
      register: grafana_key_download
      when: grafana_key_head.status is defined and grafana_key_head.status == 200

    - name: Convert Grafana GPG key to keyring
      ansible.builtin.command: >
        gpg --dearmor --yes --output /etc/apt/keyrings/grafana.gpg
        /etc/apt/keyrings/grafana.gpg.asc
      changed_when: grafana_key_download.changed
      when: grafana_key_download is defined and grafana_key_download.changed | default(false)

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://mirrors.cernet.edu.cn/grafana/apt/ stable main"
    filename: grafana
    state: present

- name: update apt cache after adding repo
  ansible.builtin.apt:
    update_cache: true

- name: install grafana package
  ansible.builtin.apt:
    name: grafana
    state: present

- name: enable and start grafana
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true

- name: Ensure Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/alerting

- name: Find existing datasource provisioning files
  ansible.builtin.find:
    paths: /etc/grafana/provisioning/datasources
    patterns:
      - "*.yml"
      - "*.yaml"
    file_type: file
  register: grafana_datasource_files

- name: Remove stale datasource provisioning files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_datasource_files.files }}"
  when: (item.path | basename) != "datasources.yml"
  notify: restart grafana

- name: Find existing alerting provisioning files
  ansible.builtin.find:
    paths: /etc/grafana/provisioning/alerting
    patterns:
      - "*.yml"
      - "*.yaml"
    file_type: file
  register: grafana_alerting_files

- name: Remove stale alerting provisioning files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_alerting_files.files }}"
  when: (item.path | basename) != "provision.yml"
  notify: restart grafana

- name: Remove alerting provisioning file (temporary disabled)
  ansible.builtin.file:
    path: /etc/grafana/provisioning/alerting/provision.yml
    state: absent
  when: not grafana_manage_alerting_provisioning
  notify: restart grafana

- name: Remove disabled alerting provisioning file (temporary disabled)
  ansible.builtin.file:
    path: /etc/grafana/provisioning/alerting/provision.yml.disabled
    state: absent
  notify: restart grafana

- name: Provision Grafana alerting config
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.first_found', params) }}"
    dest: /etc/grafana/provisioning/alerting/provision.yml
    owner: grafana
    group: grafana
    mode: "0644"
  vars:
    params:
      files:
        - "{{ inventory_hostname }}.yml"
        - default.yml
      paths:
        - "{{ inventory_dir }}/files/grafana/alerting"
  when: grafana_manage_alerting_provisioning
  notify: restart grafana

- name: Provision Grafana datasources config
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.first_found', params) }}"
    dest: /etc/grafana/provisioning/datasources/datasources.yml
    owner: grafana
    group: grafana
    mode: "0644"
  vars:
    params:
      files:
        - "{{ inventory_hostname }}.yml"
        - default.yml
      paths:
        - "{{ inventory_dir }}/files/grafana/datasources"
  notify: restart grafana

- name: Reload Grafana after provisioning
  ansible.builtin.meta: flush_handlers
