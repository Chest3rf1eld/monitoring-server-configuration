---
- name: update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Install Grafana APT prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - wget
    state: present

- name: Ensure Grafana keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Grafana GPG key
  block:
    - name: Check Grafana GPG key URL availability
      ansible.builtin.uri:
        url: https://apt.grafana.com/gpg.key
        method: HEAD
        return_content: false
        timeout: 10
        validate_certs: true
      register: grafana_key_head
      failed_when: false
      changed_when: false

    - name: Download Grafana GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.gpg.asc
        mode: "0644"
      register: grafana_key_download
      when: grafana_key_head.status is defined and grafana_key_head.status == 200

    - name: Convert Grafana GPG key to keyring
      ansible.builtin.command: >
        gpg --dearmor --yes --output /etc/apt/keyrings/grafana.gpg
        /etc/apt/keyrings/grafana.gpg.asc
      changed_when: grafana_key_download.changed
      when: grafana_key_download is defined and grafana_key_download.changed | default(false)

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://mirrors.cernet.edu.cn/grafana/apt/ stable main"
    filename: grafana
    state: present

- name: update apt cache after adding repo
  ansible.builtin.apt:
    update_cache: true

- name: install grafana package
  ansible.builtin.apt:
    name: grafana
    state: present

- name: enable and start grafana
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true

- name: Ensure Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning
    - /etc/grafana/provisioning/datasources

- name: Provision Prometheus datasource
  ansible.builtin.template:
    src: provisioning/datasources/prometheus.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: Provision Loki datasource
  ansible.builtin.template:
    src: provisioning/datasources/loki.yml.j2
    dest: /etc/grafana/provisioning/datasources/loki.yml
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: Reload Grafana after provisioning
  ansible.builtin.meta: flush_handlers
