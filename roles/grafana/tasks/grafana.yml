---
- name: update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false # директива чтобы ansible думал, что это задача не вносит изменений, как оно и есть на самом деле

- name: Install Grafana APT prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - wget
    state: present

- name: Ensure Grafana keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Grafana GPG key
  block:
    - name: Check Grafana GPG key URL доступность
      ansible.builtin.uri:
        url: https://apt.grafana.com/gpg.key
        method: HEAD
        return_content: false
        timeout: 10
        validate_certs: true
      register: grafana_key_head
      failed_when: false
      changed_when: false

    - name: Download Grafana GPG key (primary)
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.gpg.asc
        mode: "0644"
      register: grafana_key_download
      when: grafana_key_head.status is defined and grafana_key_head.status == 200

    - name: Convert Grafana GPG key to keyring
      ansible.builtin.command: >
        gpg --dearmor --yes --output /etc/apt/keyrings/grafana.gpg
        /etc/apt/keyrings/grafana.gpg.asc
      changed_when: grafana_key_download.changed
      when: grafana_key_download is defined and grafana_key_download.changed | default(false)
  rescue:
    - name: Fetch Grafana GPG key from keyserver (fallback)
      ansible.builtin.command: >
        gpg --batch --keyserver hkps://keyserver.ubuntu.com
        --recv-keys 963FA27710458545
      changed_when: true

    - name: Export Grafana GPG key to keyring (fallback)
      ansible.builtin.shell: >
        gpg --batch --export 963FA27710458545 |
        gpg --dearmor --yes --output /etc/apt/keyrings/grafana.gpg
      args:
        executable: /bin/bash
      changed_when: true

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://mirrors.cernet.edu.cn/grafana/apt/ stable main"
    filename: grafana
    state: present

- name: update apt cache after adding repo
  ansible.builtin.apt:
    update_cache: true

- name: install grafana package
  ansible.builtin.apt:
    name: grafana
    state: present

- name: enable and start grafana
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true
