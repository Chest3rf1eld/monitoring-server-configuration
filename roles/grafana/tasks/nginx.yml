---
- name: update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false # директива чтобы ansible думал, что это задача не вносит изменений, как оно и есть на самом деле

- name: install nginx package
  ansible.builtin.apt:
    name: nginx
    state: present
  
- name: enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Install Certbot
  ansible.builtin.apt:
    name: certbot
    state: present
  when: grafana_enable_https | bool

- name: Create Let's Encrypt webroot
  ansible.builtin.file:
    path: "{{ grafana_letsencrypt_webroot }}"
    state: directory
    mode: "0755"
  when: grafana_enable_https | bool

- name: Check Grafana certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ grafana_domain }}/fullchain.pem"
  register: grafana_cert
  when: grafana_enable_https | bool

- name: Set Grafana certificate flag
  ansible.builtin.set_fact:
    grafana_cert_exists: "{{ grafana_cert.stat.exists | default(false) }}"
  when: grafana_enable_https | bool

- name: Ensure HTTPS config applied when certificate exists
  ansible.builtin.template:
    src: nginx-grafana.conf.j2
    dest: /etc/nginx/sites-available/grafana.conf
    mode: "0644"
  vars:
    grafana_cert_exists: "{{ grafana_cert_exists | default(false) }}"
  notify: reload nginx
  when:
    - grafana_enable_https | bool
    - grafana_cert_exists | default(false)

- name: Configure Nginx reverse proxy for Grafana
  ansible.builtin.template:
    src: nginx-grafana.conf.j2
    dest: /etc/nginx/sites-available/grafana.conf
    mode: "0644"
  vars:
    grafana_cert_exists: "{{ grafana_cert_exists | default(false) }}"
  notify: reload nginx

- name: Enable Grafana Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/grafana.conf
    dest: /etc/nginx/sites-enabled/grafana.conf
    state: link
  notify: reload nginx

- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Reload Nginx before ACME challenge
  ansible.builtin.meta: flush_handlers
  when: grafana_enable_https | bool

- name: Obtain Let's Encrypt certificate (if missing)
  ansible.builtin.command: >
    certbot certonly --webroot
    -w {{ grafana_letsencrypt_webroot }}
    -d {{ grafana_domain }}
    --agree-tos --non-interactive
    --email {{ grafana_letsencrypt_email }}
  register: grafana_certbot
  changed_when: grafana_certbot.rc == 0
  when:
    - grafana_enable_https | bool
    - not (grafana_cert_exists | default(false))

- name: Update Nginx config for HTTPS
  ansible.builtin.template:
    src: nginx-grafana.conf.j2
    dest: /etc/nginx/sites-available/grafana.conf
    mode: "0644"
  vars:
    grafana_cert_exists: true
  notify: reload nginx
  when:
    - grafana_enable_https | bool
    - grafana_certbot is defined
    - (grafana_certbot.rc | default(1)) == 0
