    type: prometheus
    access: proxy
    url: http://<OBSERVATION_SERVER_IP>:9090
    isDefault: false
    editable: false
  - name: monitoring-server01
    type: prometheus
    access: proxy
    url: http://<PROXY_SERVER_IP>:9090
    isDefault: true
    editable: false
  - name: loki-monitoring-server02
    type: loki
    access: proxy
    url: http://<OBSERVATION_SERVER_IP>:3100
    isDefault: false
    editable: false
  - name: loki-monitoring-server01
    type: loki
    access: proxy
    url: http://<PROXY_SERVER_IP>:3100
    isDefault: false
    editable: false
