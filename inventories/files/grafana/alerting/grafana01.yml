apiVersion: 1

groups:
  - orgId: 1
    name: website-availability
    folder: Provisioned Alerts
    interval: 1m
    rules:
      - uid: cfdtg11sx1kowa
        title: <MONITORED_SITE> unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prom_host01
            model:
              datasource:
                type: prometheus
                uid: prom_host01
              editorMode: code
              expr: probe_success{job="blackbox_exporter",instance="https://<MONITORED_SITE>"}
              hide: false
              instant: true
              interval: ""
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        keepFiringFor: 5m
        annotations:
          summary: <MONITORED_SITE> недоступен
          description: Сайт https://<MONITORED_SITE> недоступен более 5 минут с точки наблюдения monitoring-server01
        labels:
          severity: critical
          site: <MONITORED_SITE>
        isPaused: false
